name: PR CI - ASP.NET Core WebApp # 定義工作流程的名稱，方便識別

on:
  pull_request: # 當有 Pull Request 時觸發此工作流程
    branches:
      - main # 僅在 main 分支的 Pull Request 觸發

jobs:
  build-and-test: # 定義一個名為 build-and-test 的工作
    name: Build and Test # 工作的顯示名稱
    runs-on: ubuntu-latest # 指定執行此工作的作業系統環境

    steps:
      - name: Checkout code # 檢出程式碼到執行環境
        uses: actions/checkout@v3 # 使用 GitHub 提供的 checkout action

      - name: Setup .NET SDK # 設定 .NET SDK 環境
        uses: actions/setup-dotnet@v4 # 使用 GitHub 提供的 setup-dotnet action
        with:
          dotnet-version: '8.0.x'  # 指定使用的 .NET SDK 版本，根據專案需求調整

      - name: Restore dependencies # 還原專案的相依性
        run: dotnet restore # 執行 dotnet restore 指令

      - name: Build # 建置專案
        run: dotnet build --no-restore --configuration Release # 執行建置，使用 Release 組態，並跳過還原相依性
        
      - name: Get PR Diff # 取得 Pull Request 的程式碼差異
        id: diff # 設定此步驟的 ID，供後續步驟參考
        run: |
          echo "Getting diff for PR #${{ github.event.pull_request.number }}" # 顯示目前處理的 PR 編號
          git fetch origin main # 取得 main 分支的最新變更
          git diff origin/main > diff.txt # 比較 main 分支與 PR 的差異，並將結果輸出到 diff.txt
      
      - name: Call OpenAI for Review # 呼叫 OpenAI API 進行程式碼審查
        id: openai_review # 設定此步驟的 ID，供後續步驟參考
        run: |
          echo "Calling OpenAI API to analyze code diff..." # 顯示呼叫 OpenAI API 的訊息
      
          DIFF_CONTENT=$(cat diff.txt | head -c 6000 | jq -Rs .) # 讀取 diff.txt 的內容，並限制字元數
      
          REQUEST_DATA=$(jq -n \ # 構建發送給 OpenAI API 的請求資料
            --arg model "gpt-4o" \
            --arg system_msg "你是一位資深程式碼審查員，專長在於找出技術債、重構建議與 clean code 和 SOLID 原則。" \
            --arg user_msg "以下是 pull request 的程式碼差異，請指出是否有技術債、壞味道、維護風險、安全問題，並給出重構建議：\n\n$(cat diff.txt | head -c 6000)" \
            '{
              model: $model,
              temperature: 0.7,
              messages: [
                { role: "system", content: $system_msg },
                { role: "user", content: $user_msg }
              ]
            }')
      
          echo "🟡 Sending this request to OpenAI:" # 顯示即將發送的請求資料
          echo "$REQUEST_DATA" | jq . # 格式化顯示請求資料
      
          RESPONSE=$(curl https://api.openai.com/v1/chat/completions \ # 呼叫 OpenAI API 並取得回應
            -s \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -d "$REQUEST_DATA")
      
          echo "🟢 OpenAI 回應內容：" # 顯示 OpenAI 的回應內容
          echo "$RESPONSE" | jq . # 格式化顯示回應資料
      
          echo "$RESPONSE" | jq -r '.choices[0].message.content' > review.txt # 將回應內容儲存到 review.txt

          REVIEW_CONTENT=$(cat review.txt | perl -pe 's/\\n/\n/g') # 讀取 review.txt 並處理換行符號
          echo "review<<EOF" >> $GITHUB_OUTPUT # 將審查意見輸出到 GitHub Actions 的輸出變數
          echo "$REVIEW_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR # 在 Pull Request 上發表評論
        uses: peter-evans/create-or-update-comment@v3 # 使用 GitHub 提供的 create-or-update-comment action
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # 使用 GitHub Token 進行身份驗證
          issue-number: ${{ github.event.pull_request.number }} # 指定評論的 Pull Request 編號
          body: |
            🤖 **AI 程式碼審查意見**
            以下是 OpenAI GPT-4o 對此 PR 的分析與建議：

            ${{ steps.openai_review.outputs.review }} # 插入 OpenAI 的審查意見

      - name: Run tests # 執行單元測試
        run: dotnet test --no-build --configuration Release --logger "trx" # 執行測試，使用 Release 組態，並產生測試報告
